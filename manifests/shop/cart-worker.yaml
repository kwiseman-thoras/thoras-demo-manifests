# Everything for cart-worker lives in this one multi-document file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-worker
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: {app: cart-worker}
  template:
    metadata:
      labels: {app: cart-worker}
    spec:
      containers:
      - name: worker
        image: registry.k8s.io/pause:3.10
        resources:
          requests: {cpu: 10m, memory: 16Mi}   # flow style on purpose
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cart-worker
  namespace: shop
spec:
  minAvailable: 2   # == replicas, so 0 disruptions allowed
  selector:
    matchLabels: {app: cart-worker}
